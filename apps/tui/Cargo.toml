[package]
name = "templar-tui"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xB4LdW1n/templar-wallet"
publish = false
edition = "2021"

[[bin]]
name = "templar"
path = "src/main.rs"

[dependencies]
# Pinned by tag; Cargo.lock records the exact commit. To build against a local
# checkout of the library instead, see docs/build/README.md ("The engine").
templarlib = { git = "https://github.com/0xB4LdW1n/templarlib", tag = "v0.1.0" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rpassword = "7.4"
serde_json = "1.0"
zeroize = "1"
