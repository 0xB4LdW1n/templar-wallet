# Builds Templar Wallet for every platform and, on a version tag, publishes
# the GitHub release the website's download links point at.
#
#   git push origin vX.Y.Z      checks, five platform builds, one release
#   Actions > release > Run     the same builds, as artifacts of the run
#                               (tick "draft" to also get a draft release)
#
# The website links to version-less file names:
#   https://github.com/<owner>/<repo>/releases/latest/download/<file>
# /releases/latest skips drafts and pre-releases, so a vX.Y.Z tag publishes a
# normal release, and only once EVERY build has succeeded: a release missing
# one file would turn that file's link on the site into a 404 until the next
# version. A tag with a suffix (v0.2.0-rc.1) publishes a pre-release, which
# the site's links never see.
#
# Every job runs on a GitHub-hosted runner. Never attach a self-hosted runner
# to this public repository: workflow code from a fork's pull request could
# run on it. This workflow never runs for pull requests (ci.yml does, with no
# secrets and a read-only token), and only the `release` job can write.
#
# The platform builds restore no cache: a release is compiled from Cargo.lock
# and pubspec.lock alone, so nothing a cache entry carries can end up in a
# published binary, or run next to the Android signing key. That costs some
# minutes per release; the builds run in parallel.
#
# Third-party actions are pinned to a full commit SHA (the comment names the
# release); see ci.yml for how to update one.
#
# Version bump, tagging, the signing secrets, the stable links, local builds:
# docs/build/RELEASE.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: >-
          Also create a DRAFT release from these builds. Visible to
          maintainers only; the vX.Y.Z tag build replaces it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A tag build is never cancelled halfway through publishing; a new manual
  # run on a branch replaces the one in progress.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Keep in step with ci.yml, scripts/build_linux.sh and
  # scripts/build_windows.ps1.
  FLUTTER_VERSION: "3.44.1"
  RUST_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  # The version the file names, the installer and the release come from,
  # checked against the tag before an hour of building: a tag vX.Y.Z must be
  # exactly the version pubspec.yaml carries, or the installer, the app's
  # About box and the release page would each name a different one.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        name: Read pubspec.yaml, check the tag
        run: |
          pubspec=apps/gui/pubspec.yaml
          line="$(grep -m1 -E '^version:' "$pubspec" || true)"
          full="$(sed -E 's/^version:[[:space:]]*//; s/[[:space:]#].*$//' <<<"$line")"
          version="${full%%+*}"
          build="${full#"$version"}"
          build="${build#+}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=$pubspec::no X.Y.Z version on the version: line (found '$line')"
            exit 1
          fi
          if [[ ! "$build" =~ ^[0-9]+$ ]]; then
            echo "::warning file=$pubspec::no +N build number after $version: the APKs get versionCode 1 and cannot update an install of an earlier release"
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in $pubspec (expected v$version). Delete the tag, fix whichever is wrong, tag again."
            exit 1
          fi
          prerelease=false
          [[ "$version" != *-* ]] || prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Templar Wallet **$version** (build ${build:-none}; pre-release: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS
    needs: [version, checks]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flutter builds the app universal (arm64 + x86_64). The Xcode Run
      # Script phase (apps/gui/macos/copy_wallet_ffi.sh) builds
      # libwallet_ffi.dylib once per Rust target installed on rustup's default
      # toolchain and lipo-s the slices together, so the x86_64 target here is
      # what gives the dylib its Intel slice. Without it an Intel Mac cannot
      # load the engine at all.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build the app
        working-directory: apps/gui
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release
      - name: Check both architectures are inside
        run: |
          app=apps/gui/build/macos/Build/Products/Release/templar_wallet.app
          for bin in "$app/Contents/MacOS/templar_wallet" "$app/Contents/Frameworks/libwallet_ffi.dylib"; do
            archs="$(lipo -archs "$bin")"
            echo "$(basename "$bin"): $archs"
            if [[ " $archs " != *" arm64 "* || " $archs " != *" x86_64 "* ]]; then
              echo "::error::$bin is not universal (it has: $archs)"
              exit 1
            fi
          done
      # Unsigned for now: docs/build/RELEASE.md, "Code signing". hdiutil on
      # hosted Macs is known to fail now and then with "Resource busy"; a
      # second attempt gets through.
      - name: Package the DMG
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            ./scripts/make_dmg.sh && break
            if (( attempt == 3 )); then exit 1; fi
            echo "::warning::make_dmg.sh failed (attempt $attempt of 3), retrying"
            hdiutil detach "/Volumes/Templar Wallet" -force 2>/dev/null || true
            sleep 20
          done
          mkdir -p out
          mv dist/TemplarWallet-*-macos.dmg out/TemplarWallet-macos.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TemplarWallet-macos
          path: out/TemplarWallet-macos.dmg
          if-no-files-found: error

  # The Android APKs, built in the pinned container (reproducible/Dockerfile)
  # exactly as scripts/repro_build.sh builds them on anyone's machine, then
  # signed. No build code ever sees the release key: the build signs with a
  # throwaway debug key, and the next step re-signs with apksigner from the
  # same image, in a container with no network that holds only the APKs and
  # the keystore. --alignment-preserved keeps every entry where the build put
  # it, so signing changes the APK Signing Block alone and
  # scripts/repro_compare_apk.py can match the release against a rebuild.
  android:
    name: Android
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      cert-sha256: ${{ steps.verify.outputs.cert-sha256 }}
    env:
      # A tag, or a manual run that asked for a draft release, must ship APKs
      # signed with the release key. A plain manual run may keep the build's
      # throwaway debug key.
      REQUIRE_RELEASE_KEY: ${{ github.ref_type == 'tag' || inputs.draft }}
    steps:
      # Before anything else, so a tag without the key fails in seconds.
      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "Release signing key: configured."
          elif (( ${#missing[@]} < 4 )); then
            echo "::error::Android signing secrets incomplete, missing: ${missing[*]}"
            exit 1
          elif [[ "$REQUIRE_RELEASE_KEY" == true ]]; then
            echo "::error::The Android signing secrets are not set, and a release never ships debug-signed APKs. See docs/build/RELEASE.md, 'The Android signing key'."
            exit 1
          else
            echo "::warning::No Android signing secrets: these APKs carry this runner's throwaway debug key. For testing only: they cannot update a release install, nor be updated by one."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Android image (SDK, NDK, JDK, Flutter, Rust) and the build need
      # more disk than the runner leaves free; drop preinstalled toolchains
      # this job does not use (the runner's own Android SDK among them).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build in the reproducible container
        run: ./scripts/repro_build.sh --target android --out built
      - name: Sign with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "No release key: the APKs keep the build's debug signature."
            exit 0
          fi
          keydir="$(mktemp -d "$RUNNER_TEMP/key.XXXXXX")"
          trap 'rm -rf "$keydir"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keydir/upload.jks")
          chmod 755 "$keydir"
          chmod 644 "$keydir/upload.jks"
          image="$(./scripts/repro_build.sh --print-image --target android)"
          mkdir -p signed
          docker run --rm --network none --platform linux/amd64 \
            -v "$PWD/built:/in:ro" -v "$PWD/signed:/out" -v "$keydir:/key:ro" \
            -e KS_PASS="$ANDROID_KEYSTORE_PASSWORD" -e KEY_ALIAS="$ANDROID_KEY_ALIAS" -e KEY_PASS="$ANDROID_KEY_PASSWORD" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$image" bash -c '
              set -euo pipefail
              apksigner=/opt/android-sdk/build-tools/36.0.0/apksigner
              for f in /in/TemplarWallet-android-*.apk; do
                "$apksigner" sign --ks /key/upload.jks --ks-pass env:KS_PASS \
                  --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
                  --v1-signing-enabled false --alignment-preserved \
                  --out "/out/$(basename "$f")" "$f"
              done
              rm -f /out/*.idsig
              chown "$HOST_UID:$HOST_GID" /out/*.apk'
          mv -f signed/*.apk built/
      # Belt and braces: a release APK signed with a debug key fails the job
      # here. Both APKs must carry one and the same certificate; its SHA-256
      # goes into the release notes.
      - id: verify
        name: Check the signatures
        run: |
          image="$(./scripts/repro_build.sh --print-image --target android)"
          mkdir -p out
          digests=()
          for arch in arm64 x86_64; do
            name="TemplarWallet-android-$arch.apk"
            certs="$(docker run --rm --network none --platform linux/amd64 -v "$PWD/built:/in:ro" "$image" \
              /opt/android-sdk/build-tools/36.0.0/apksigner verify --print-certs "/in/$name")"
            echo "== $name"
            echo "$certs"
            if grep -q 'CN=Android Debug' <<<"$certs" && [[ "$REQUIRE_RELEASE_KEY" == true ]]; then
              echo "::error::$name is signed with a debug key"
              exit 1
            fi
            # Older apksigner prints "Signer #1 certificate …", newer ones
            # "V2 Signer: certificate …" (one line per scheme): take the first.
            digests+=("$(sed -n -E 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' <<<"$certs" | head -n 1)")
            cp "built/$name" "out/$name"
          done
          if [[ -z "${digests[0]}" || "${digests[0]}" != "${digests[1]}" ]]; then
            echo "::error::the two APKs are not signed by one and the same certificate"
            exit 1
          fi
          echo "cert-sha256=${digests[0]}" >> "$GITHUB_OUTPUT"
          echo "Android signing certificate SHA-256: \`${digests[0]}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TemplarWallet-android
          path: out/*.apk
          if-no-files-found: error

  # The Linux x64 bundle, built in the pinned container. The image is Ubuntu
  # 22.04 (glibc 2.35), so the bundle runs on Ubuntu 22.04+, Debian 12+ and
  # their generation whatever runner image builds it.
  linux:
    name: Linux
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build in the reproducible container
        run: ./scripts/repro_build.sh --target linux --out out
      - name: Glibc floor
        run: |
          x="$(mktemp -d)"
          tar -xzf out/TemplarWallet-linux-x64.tar.gz -C "$x"
          # The newest glibc symbol anything asks for = the oldest glibc the
          # bundle runs on.
          glibc="$(cd "$x/TemplarWallet-linux-x64" && objdump -T templar_wallet lib/*.so | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "Linux bundle: needs glibc $glibc or newer" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TemplarWallet-linux-x64
          path: out/TemplarWallet-linux-x64.tar.gz
          if-no-files-found: error

  # A second, independent build of the Linux and Android files on another
  # runner image (another kernel, Docker and disk), from the same commit.
  # `compare` publishes nothing unless both builds agree. ubuntu-22.04 leaves
  # GitHub on 2027-04-17: move this to the next runner image that is not
  # ubuntu-24.04 before then.
  reproduce:
    name: Rebuild ${{ matrix.target }}
    needs: [version, checks]
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [linux, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in the android job: the image and the build need the room.
      - name: Free disk space
        if: matrix.target == 'android'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build in the reproducible container
        run: ./scripts/repro_build.sh --target "${{ matrix.target }}" --out rebuilt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-${{ matrix.target }}
          path: rebuilt/TemplarWallet-*
          if-no-files-found: error
          retention-days: 14

  # The release files against the second build: the tarball byte for byte,
  # each APK with its signature set aside (scripts/repro_compare_apk.py).
  compare:
    name: Reproducibility
    needs: [linux, android, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TemplarWallet-linux-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TemplarWallet-android
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rebuilt-*
          path: rebuilt
          merge-multiple: true
      - name: Compare the two builds
        run: |
          status=0
          {
            echo "### Reproducibility"
            echo
            echo "| File | Release build | Second build | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in TemplarWallet-linux-x64.tar.gz TemplarWallet-android-arm64.apk TemplarWallet-android-x86_64.apk; do
            a="$(sha256sum "release/$f" | cut -c1-16)"
            b="$(sha256sum "rebuilt/$f" | cut -c1-16)"
            case "$f" in
              *.apk) if python3 scripts/repro_compare_apk.py "release/$f" "rebuilt/$f"; then r="match, signatures aside"; else r="**DIFFER**"; status=1; fi ;;
              *) if cmp "release/$f" "rebuilt/$f"; then r="identical"; else r="**DIFFER**"; status=1; fi ;;
            esac
            echo "| \`$f\` | \`$a…\` | \`$b…\` | $r |" >> "$GITHUB_STEP_SUMMARY"
          done
          if (( status )); then
            echo "::error::the two builds of this commit differ: the release is not reproducible. Download both artifacts and run diffoscope on them."
          fi
          exit "$status"

  windows:
    name: Windows
    needs: [version, checks]
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Rust engine
        run: cargo build --locked --release -p wallet-ffi
      - name: Build the app
        working-directory: apps/gui
        run: |
          # A failing native command stops the step (pwsh otherwise carries on).
          $PSNativeCommandUseErrorActionPreference = $true
          flutter pub get --enforce-lockfile
          flutter build windows --release
      - name: Bundle and zip
        run: |
          $bundle = (Resolve-Path 'apps/gui/build/windows/x64/runner/Release').Path
          # The Dart loader opens wallet_ffi.dll from the exe's folder.
          Copy-Item target/release/wallet_ffi.dll $bundle
          Copy-Item INSTALL.md (Join-Path $bundle 'README.md')
          $out = New-Item -ItemType Directory -Force -Path out
          # The portable build, files at the root of the zip: Explorer's
          # "Extract All" then gives one TemplarWallet-windows-x64 folder with
          # templar_wallet.exe inside. .NET writes '/' separators, which every
          # unzip tool reads.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($bundle,
            (Join-Path $out.FullName 'TemplarWallet-windows-x64.zip'),
            [IO.Compression.CompressionLevel]::Optimal, $false)
      # Unsigned for now: docs/build/RELEASE.md, "Code signing".
      - name: Installer (Inno Setup)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The newest ISCC.exe on PATH, under either Program Files (Inno
          # Setup 6 installs 32-bit into "Inno Setup 6", 7 is a 64-bit
          # program with its own folder), or wherever an uninstall entry says
          # it went. The .iss compiles with 6.3+ and with 7.
          function Find-Iscc {
            $found = @()
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $found += $cmd.Source }
            foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if (-not $root) { continue }
              $found += Get-ChildItem -Path $root -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue |
                ForEach-Object { Join-Path $_.FullName 'ISCC.exe' }
            }
            $found += Get-ChildItem -ErrorAction SilentlyContinue -Path @(
                'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
                'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall') |
              Where-Object { $_.PSChildName -like 'Inno Setup*_is1' } |
              ForEach-Object { $_.GetValue('InstallLocation') } |
              Where-Object { $_ } |
              ForEach-Object { Join-Path $_ 'ISCC.exe' }
            $found | Where-Object { $_ -and (Test-Path -LiteralPath $_) } |
              Sort-Object -Descending -Property {
                $v = (Get-Item -LiteralPath $_).VersionInfo
                [version]::new($v.FileMajorPart, $v.FileMinorPart, $v.FileBuildPart)
              } |
              Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup was installed but no ISCC.exe was found' }
          Write-Host "ISCC: $iscc ($((Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion))"
          # /O and /F override the script's OutputDir and OutputBaseFilename:
          # the installer lands in out\ under its stable name.
          $out = (Resolve-Path out).Path
          & $iscc "/DMyAppVersion=$env:VERSION" "/O$out" '/FTemplarWallet-windows-x64-setup' packaging\windows\templar-wallet.iss
          if (-not (Test-Path -LiteralPath (Join-Path $out 'TemplarWallet-windows-x64-setup.exe'))) {
            throw 'ISCC finished but out\TemplarWallet-windows-x64-setup.exe is missing'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TemplarWallet-windows-x64
          path: |
            out/TemplarWallet-windows-x64-setup.exe
            out/TemplarWallet-windows-x64.zip
          if-no-files-found: error

  # Runs only when every job it needs succeeded (an `if` without a status
  # function implies success()): one failed build, and nothing is published.
  release:
    name: Publish the release
    needs: [version, macos, android, linux, windows, compare]
    if: github.ref_type == 'tag' || inputs.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      DRAFT: ${{ github.ref_type != 'tag' }}
      CERT_SHA256: ${{ needs.android.outputs.cert-sha256 }}
      # The website links to exactly these names. SHA256SUMS.txt is added.
      ASSETS: >-
        TemplarWallet-macos.dmg
        TemplarWallet-windows-x64-setup.exe
        TemplarWallet-windows-x64.zip
        TemplarWallet-linux-x64.tar.gz
        TemplarWallet-android-arm64.apk
        TemplarWallet-android-x86_64.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: TemplarWallet-*
          path: assets
          merge-multiple: true
      - name: Check every file is there, write SHA256SUMS.txt
        working-directory: assets
        run: |
          read -ra assets <<<"$ASSETS"
          for f in "${assets[@]}"; do
            [[ -s "$f" ]] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          # The body of this version's CHANGELOG.md section: everything after
          # its heading, "## [X.Y.Z] — YYYY-MM-DD" (Keep a Changelog; plain
          # "## X.Y.Z" and "## vX.Y.Z" match too), up to the next "## "
          # heading. "## [X.Y.Z-rc.1]" is another version's section. The
          # heading itself is left out: it only carries the date, and the
          # release has its own. Trailing blank lines, rules and link
          # definitions ("[X.Y.Z]: https://…") are trimmed.
          section="$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              h = substr($0, 4); sub(/^\[/, "", h); sub(/^v/, "", h)
              rest = substr(h, length(ver) + 1); c = substr(rest, 1, 1)
              if (index(h, ver) == 1 && (rest == "" || c == " " || c == "\t" || c == "]")) { found = 1; next }
            }
            found { lines[++n] = $0 }
            END {
              s = 1
              while (s <= n && lines[s] ~ /^[ \t\r]*$/) s++
              while (n >= s && (lines[n] ~ /^[ \t\r]*$/ || lines[n] ~ /^---+[ \t\r]*$/ || lines[n] ~ /^\[.*\]:[ \t]/)) n--
              for (i = s; i <= n; i++) print lines[i]
            }' CHANGELOG.md)"
          if [[ -z "$section" ]]; then
            echo "::warning file=CHANGELOG.md::no '## $VERSION' section: the release notes only link to CHANGELOG.md"
            section="Templar Wallet $VERSION. What changed: [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)."
          fi
          releases="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          if [[ "$PRERELEASE" == true ]]; then dl="$releases/download/$TAG"; else dl="$releases/latest/download"; fi
          {
            if [[ "$DRAFT" == true ]]; then
              echo "> Draft built by a manual run of release.yml from \`$GITHUB_REF_NAME\` ($GITHUB_SHA). Not the release: pushing the tag $TAG builds that, and replaces this draft."
              echo
            fi
            echo "$section"
            echo
            echo "## Download"
            echo
            echo "| For | File |"
            echo "|---|---|"
            echo "| macOS, Apple silicon and Intel | [TemplarWallet-macos.dmg]($dl/TemplarWallet-macos.dmg) |"
            echo "| Windows x64, installer | [TemplarWallet-windows-x64-setup.exe]($dl/TemplarWallet-windows-x64-setup.exe) |"
            echo "| Windows x64, portable | [TemplarWallet-windows-x64.zip]($dl/TemplarWallet-windows-x64.zip) |"
            echo "| Linux x64 | [TemplarWallet-linux-x64.tar.gz]($dl/TemplarWallet-linux-x64.tar.gz) |"
            echo "| Android, phones | [TemplarWallet-android-arm64.apk]($dl/TemplarWallet-android-arm64.apk) |"
            echo "| Android, emulators and x86_64 Chromebooks | [TemplarWallet-android-x86_64.apk]($dl/TemplarWallet-android-x86_64.apk) |"
            echo "| SHA-256 of every file | [SHA256SUMS.txt]($dl/SHA256SUMS.txt) |"
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "A pre-release: these links are this version's files. The \`releases/latest/download/…\` links keep serving the newest stable release."
            else
              echo "These links always serve the newest release; this version's own files are listed under **Assets** below."
            fi
            if [[ -n "$CERT_SHA256" ]]; then
              echo
              echo "The APKs are signed by the certificate with SHA-256 \`$CERT_SHA256\` (check: \`apksigner verify --print-certs <file>.apk\`)."
            fi
            echo
            echo "The Linux and Android files are reproducible: \`scripts/repro_verify.sh $TAG\` rebuilds them from this tag's source and compares them with these ([docs/build/REPRODUCIBLE.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/docs/build/REPRODUCIBLE.md))."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish
        working-directory: assets
        run: |
          read -ra assets <<<"$ASSETS"
          # A draft for this tag (an interrupted attempt, or a manual run with
          # "draft") is replaced. A published release is never touched: its
          # files are already on people's disks and their checksums on the web.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | "\(.id) \(.draft)"')"
          while read -r id draft; do
            [[ -n "$id" ]] || continue
            if [[ "$draft" != true ]]; then
              echo "::error::$TAG is already published. Never replace a published release: bump the version and tag again."
              exit 1
            fi
            echo "Deleting the earlier draft release $id for $TAG"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done <<<"$existing"

          flags=(--repo "$GITHUB_REPOSITORY" --title "Templar Wallet $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$DRAFT" == true ]]; then
            flags+=(--draft --target "$GITHUB_SHA")
          elif [[ "$PRERELEASE" == true ]]; then
            flags+=(--verify-tag --prerelease --latest=false)
          else
            flags+=(--verify-tag)
            # The newest version is what /releases/latest, and so the site,
            # serves. A fix for an older line, published after a newer
            # version, must not pull the site's links back to it.
            current="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
            newest="$(printf '%s\n%s\n' "${current#v}" "$VERSION" | sort -V | tail -n 1)"
            if [[ -n "$current" && "$newest" != "$VERSION" ]]; then
              echo "::notice::$TAG is older than the current latest release $current: published without becoming the latest"
              flags+=(--latest=false)
            else
              flags+=(--latest)
            fi
          fi
          # With files to upload, gh creates the release as a draft, uploads
          # every file, then publishes it; a failed upload deletes the draft.
          # A published release therefore always has all seven files.
          gh release create "$TAG" "${assets[@]}" SHA256SUMS.txt "${flags[@]}"
          {
            echo "### Templar Wallet $VERSION"
            if [[ "$DRAFT" == true ]]; then
              echo "Draft release created (Releases page, visible to maintainers)."
            else
              echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
