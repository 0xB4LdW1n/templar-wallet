[package]
name = "templar-orderbook"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/0xB4LdW1n/TemplarWallet"
publish = false
edition = "2021"

[dependencies]
templar-core = { path = "../templar-core", default-features = false }
axum = "0.8.9"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3"
